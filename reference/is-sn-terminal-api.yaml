openapi: 3.1.0
info:
  version: 0.0.1
  title: Mobile Terminal Public API
  description: |-
    ## Status codes

    The response body of the endpoints contains a `status_code` field that describes the outcome of the request.
    The possible values are:

    | Status code | Name | Description |
    |-------------|------|-------------|
    | `SI000` | OK | The request has been processed successfully |
    | `SI001` | Invalid input | The input of the request is missing or not valid |
    | `SI002` | Circuit not enabled | The requested circuit is not enabled for the terminal |
    | `SI003` | Not found | The requested resource has not been found |
    | `SI004` | Database error | An error occurred while reading or writing data |
    | `SI005` | Unauthorized | The terminal is not authorized to perform the request |
    | `SI006` | Fuel Coupon Validator Error | An error occurred while calling the fuel coupon validator |
    | `SI007` | Fuel Coupon Not Valid | The fuel coupon is not valid |
    | `SI008` | Fuel Coupon Not Allowed | The fuel coupon is not allowed for the request |
    | `SI009` | Transaction Already Reversed | The transaction has already been reversed |
    | `SI010` | Supply Already Registered | The supply has already been registered |
    | `SI999` | Generic error | Unexpected error |
servers:
  - url: "https://tbd.dev.icadsistemi.com/v1"
    description: development
  - url: "https://tbd.prod.icadsistemi.com/v1"
    description: production
paths:
  /closures:
    get:
      tags:
        - Closures
      summary: Used to obtain closure terminal data
      description: |-
        It can be used to get closure data of the current period or for a previous closure.
        In the second case, it receives a datetime as input to determine the range of the requested closure.
      operationId: get-closures
      parameters:
        - name: closure_datetime
          in: query
          description: "Optional. If set, the endpoint will look for an old closure that include the requested datetime. The format for this timestamp is UNIX time in s (example: 1697444252)"
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClosureOutput"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClosureOutput"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClosureOutput"
        "422":
          description: Unprocessable Entity (malformed or missing input)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClosureOutput"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClosureOutput"
      security:
        - Cognito: []
      servers:
        - url: "https://tbd.dev.icadsistemi.com/v1"
          description: development
        - url: "https://tbd.prod.icadsistemi.com/v1"
          description: production
  /closures/reset:
    post:
      tags:
        - Closures
      summary: ""
      description: |-
        After the terminal has printed its closure receipt, it can call this endpoint to close the closure process and reset all the counts.
        So, the next closure, will start from the moment when this closure has been reset.
      operationId: post-closures-reset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
