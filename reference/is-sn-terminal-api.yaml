components:
  securitySchemes:
    Cognito:
      type: oauth2
      flows:
        password:
          tokenUrl: "tbd"
          scopes: {}
  schemas:
    InfoFuelcouponTransactionOutput:
      title: InfoFuelcouponTransactionOutput
      type: object
      properties:
        transactions:
          type: array
          description: "Details of the registered supply, one element for each fuel coupon / article pair. Not present in case of error."
          items:
            $ref: "#/components/schemas/TransactionOutput"
        status_code:
          type: string
          description: Outcome of the request (see Status codes)
      required:
        - status_code
    TransactionOutput:
      title: TransactionOutput
      type: object
      description: "Amount paid with a single fuel coupon for a single article. Fields with an empty value (`0`, `false`, empty string) are omitted."
      properties:
        payment_name:
          type: string
          description: "Name of the payment method, always `BUONO`"
        fuelcoupon_code:
          type: string
          description: Fuelcoupon full code
        fuelcoupon_number:
          type: integer
          description: Fuelcoupon number
        stan:
          type: integer
          description: Stan received in the request
        amount:
          type: number
          description: Amount paid with the fuelcoupon for the article
        date_time:
          type: string
          format: date-time
          description: Transaction date time received in the request
        progressive_number:
          type: integer
          description: Progressive number of the article in the supply
        article_id:
          type: integer
          description: Article id
        article_code:
          type: integer
          description: Article code
        ov_supply_id:
          type: integer
          description: Overview supply id received in the request for the article
        article_name:
          type: string
          description: Article name
        unit_price:
          type: number
          description: Article unit price
        measure_unit:
          type: string
          description: Unit of measure of the quantity
        is_oil:
          type: boolean
          description: "If true, is an oil product, otherwise is a not oil product"
        quantity:
          type: number
          description: Quantity paid with the fuelcoupon
    InfoPosFuelcouponReversalOutput:
      title: InfoPosTransactionReversal
      type: object
      properties:
        update_required:
          type: boolean
          description: true if the terminal must update its settings
        requires_pin:
          type: boolean
          description: true if the pin is mandatory for the next reversal. Currently always false.
        total_amount:
          type: number
          description: "Transaction total amount, the sum of each article amount"
        original_transaction_number:
          type: integer
          description: Reversable transaction number
        original_transaction_date_time:
          type: string
          format: date-time
          description: Reversable transaction date time (Europe/Rome time zone)
          readOnly: true
        original_transaction_code:
          type: string
          description: Code used when performing the actual revesal request
        supplies:
          $ref: "#/components/schemas/SuppliesFuelcoupon"
        status_code:
          type: string
          description: Outcome of the request (see Status codes)
      required:
        - update_required
        - requires_pin
        - total_amount
        - original_transaction_number
        - original_transaction_date_time
        - original_transaction_code
        - supplies
        - status_code
    SuppliesFuelcoupon:
      title: SuppliesFuelcoupon
      type: array
      description: Represent a set of supplied articles contained in a single transaction with fuelcoupon
      items:
        type: object
        properties:
          article_name:
            type: string
            description: name of the article
          amount:
            type: number
            description: amount of the transaction
          unit_price:
            type: number
            description: unit price of the transaction
          quantity:
            type: number
            description: quantity of the transaction
          is_oil:
            type: boolean
            description: "information about the selled articles: if oil or not"
          fuelcoupon_id:
            type: integer
            description: Fuelcoupon id used for the transaction
          fuelcoupon_number:
            type: string
            description: Fuelcoupon number used for the transaction
          precision:
            type: integer
          measure_unit:
            type: string
          fuelcoupon_code:
            type: string
    GetClosureOutput:
      type: object
      title: GetClosureOutput
      properties:
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        amount:
          type: number
        operations:
          type: integer
        status_code:
          type: string
    ResetClosureOutput:
      type: object
      title: ResetClosureOutput
      properties:
        status_code:
          type: string
    ConfigurationAckOutput:
      type: object
      title: ConfigurationAckOutput
      properties:
        status_code:
          type: string
    Configuration:
      type: object
      description: First/Forced dll
      properties:
        terminal_id:
          type: string
        guid:
          type: string
          description: "Represent the dll unique identifier "
        articles:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              is_oil:
                type: boolean
              unit_price:
                type: number
              measure_unit_id:
                type: integer
              precision:
                type: integer
              category_id:
                type: integer
        card_types:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              code:
                type: integer
              is_gt:
                type: boolean
                description: True if this is an external gt cards
              is_payment_card:
                type: boolean
                description: True if the card can be used as a payment card
        circuits:
          type: object
          properties:
            fuel_cards:
              type: boolean
            fuelcoupons:
              type: boolean
            credit_cards:
              type: boolean
        fuelcoupons:
          type: object
          properties:
            one_shot_automatic_amount:
              type: boolean
              description: If true the terminal will not ask user for amount in case of one shot fuelcoupons
        fuel_station:
          type: object
          properties:
            is_code:
              type: string
            merchant_code:
              type: string
            can_recharge:
              type: boolean
        measure_units:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              measure_unit:
                type: string
        passwords:
          type: object
          properties:
            password_manager:
              type: string
            password_installer:
              type: string
        payment_modes:
          type: object
          properties:
            recharges:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
            data_collection:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        supplier:
          type: object
          properties:
            id:
              type: integer
            max_amount:
              type: number
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              code:
                $ref: "#/components/schemas/code"
        enabled_card_types:
          type: array
          items:
            type: integer
        card_types_operations:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        status_code:
          type: string
      examples: []
    code:
      type: string
    StatusCode:
      title: StatusCode
      type: string
      description: |-
        Outcome of the request:
        * `SI000` - OK
        * `SI001` - Invalid input
        * `SI002` - Circuit not enabled
        * `SI003` - Not found
        * `SI004` - Database error
        * `SI005` - Unauthorized
        * `SI006` - Fuel Coupon Validator Error
        * `SI007` - Fuel Coupon Not Valid
        * `SI008` - Fuel Coupon Not Allowed
        * `SI009` - Transaction Already Reversed
        * `SI010` - Supply Already Registered
        * `SI999` - Generic error
      enum:
        - SI000
        - SI001
        - SI002
        - SI003
        - SI004
        - SI005
        - SI006
        - SI007
        - SI008
        - SI009
        - SI010
        - SI999
      examples:
        - SI000
    FuelcouponAbortInput:
      type: object
      properties:
        transaction_code:
          type: string
    FuelcouponAbortOutput:
      type: object
      title: FuelcouponAbortOutput
      properties:
        status_code:
          type: string
    ActivateFuelcouponInput:
      type: object
      properties:
        fuelcoupon_codes:
          type: array
          items:
            type: string
        stan:
          type: integer
    ActivateFuelcouponOutput:
      type: object
      title: ActivateFuelcouponOutput
      properties:
        error:
          type: string
        activation_details:
          type: object
          properties: 
            total_amount: 
              type: number
            fuelcoupons:
              type: array
              items:
                type: string
        status_code:
          type: string
    FuelcouponReversalValidationInput:
      type: object
      title: FuelcouponReversalValidationInput
      properties:
        fuelcoupons_codes:
          type: array
          description: Full codes of the fuelcoupons to be validated. Codes longer than 25 characters are truncated to the first 25 characters.
          minItems: 1
          items:
            type: string
      required:
        - fuelcoupons_codes
    FuelcouponReversalValidationOutput:
      type: object
      title: FuelcouponReversalValidationOutput
      properties:
        action_code:
          type: string
        ticket:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              font:
                type: string
        display:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              font:
                type: string
        transaction_code:
          type: string
        err_fuel_coupon_number:
          type: integer
        status_code:
          type: string
      required:
        - transaction_code
        - status_code
    FuelcouponValidationInput:
      type: object
      properties:
        fuelcoupon_code:
          type: string
        transaction_code:
          type: string
          description: Mandatory only if multiple fuelcoupon code are used for transaction
      required:
        - fuelcoupon_code
    FuelcouponValidationOutput:
      type: object
      title: FuelcouponValidationOutput
      properties:
        transaction_code:
          type: string
          description: "This identifier is used to relates the fuelcoupons to the same transaction. So for the same transaction, if the user wants to use multiple fuelcoupons, the terminal should send everytime the same transaction_id for each call to this API"
        locked_amount:
          type: number
          description: Available amount for the used fuelcoupon
        fuel_coupon_number:
          type: integer
        fuel_coupon_welfare:
          type: boolean
        fuel_coupon_vat:
          type: number
          description: VAT applied when the coupon was bought.
          minimum: 0
          maximum: 100
          examples:
            - 22
        fuel_coupon_type:
          type: integer
          description: "Type of the fuel coupon, could be 0 for one shot fuelcoupons or 1 for multi use fuelcoupons"
        status_code:
          type: string
      required:
        - fuel_coupon_type
        - status_code
      examples: []
    FuelcouponTransactionInput:
      type: object
      title: FuelcouponTransactionInput
      properties:
        transaction_number:
          type: integer
          description: Transaction number
        transaction_code:
          type: string
          description: Transaction code used for the validation of the fuelcoupons
        articles:
          type: array
          description: Articles supplied in the transaction
          items:
            $ref: "#/components/schemas/Products"
        date_time:
          type: string
          format: date-time
          description: Transaction date time
        stan:
          type: integer
          description: Stan of the transaction. It is returned as is in the response
      required:
        - transaction_code
    Products:
      title: Products
      type: object
      description: Represent a single product present in a transaction
      properties:
        code:
          type: string
          description: Product code
        quantity:
          type: number
          description: Product supplied quantity
        unit_price:
          type: number
          description: Product unit price
        amount:
          type: number
          description: Product amount (quantity * unit_price)
        is_oil:
          type: boolean
          description: "If true, is an oil product, otherwise is a not oil product"
        ov_supply_id:
          type: integer
      required:
        - code
        - quantity
        - unit_price
        - amount
        - is_oil
    FuelcouponTransactionReversalInput:
      type: object
      title: FuelcouponTransactionReversalInput
      properties:
        transaction_number:
          type: integer
          description: Number of the reversal transaction
        stan:
          type: integer
          description: Stan of the reversal transaction. Currently not used by the service
        transaction_code:
          type: string
          description: Code of the reversal transaction
        original_transaction_code:
          $ref: "#/components/schemas/transaction_code"
          description: Code of the transaction to be reversed
        reversal_transaction_date_time:
          type: string
          format: date-time
          description: Date time of the reversal transaction
      required:
        - transaction_number
        - transaction_code
        - reversal_transaction_date_time
    transaction_code:
      type: string
    FuelcouponReversalOutput:
      type: object
      title: FuelcouponReversalOutput
      properties:
        status_code:
          type: string
          description: Outcome of the request (see Status codes)
      required:
        - status_code
security:
  - Cognito: []
